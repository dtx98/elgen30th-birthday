<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 30th Birthday, Elgen!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #4a1525 0%, #883348 50%, #f43f5e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .hidden { display: none !important; }

        /* Lockscreen Styles */
        .lockscreen-container {
            text-align: center;
            width: 100%;
            max-width: 380px;
            padding: 20px;
        }
        .lock-icon-top { font-size: 22px; margin-bottom: 5px; opacity: 0.9; }
        .date-text { font-size: 14px; font-weight: 400; opacity: 0.85; margin-bottom: 4px; letter-spacing: 0.5px; }
        .time-text { font-size: 64px; font-weight: 300; letter-spacing: -2px; margin-bottom: 25px; line-height: 1; }
        
        .passcode-label { font-size: 13px; font-weight: 400; opacity: 0.9; margin-bottom: 12px; }
        
        /* Dot Indicators */
        .dots-container {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 8px;
        }
        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.8);
            background: transparent;
            transition: all 0.2s ease;
        }
        .dot.filled {
            background: #ffffff;
            border-color: #ffffff;
        }
        .hint-text { font-size: 11px; opacity: 0.7; margin-bottom: 30px; }

        /* Keypad Grid */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            max-width: 280px;
            margin: 0 auto;
        }
        .key-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: none;
            color: white;
            font-size: 24px;
            font-weight: 400;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            transition: background 0.15s, transform 0.1s;
        }
        .key-btn:active { background: rgba(255, 255, 255, 0.35); transform: scale(0.95); }
        .key-sub { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; opacity: 0.7; margin-top: -2px; }
        
        .key-zero { grid-column: 2; }
        .error-shake { animation: shake 0.4s ease-in-out; }

        /* Card Styles for Quiz */
        .card {
            background: white;
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            color: #444;
            text-align: center;
        }
        .quiz-container { text-align: left; }
        .chapter-title { font-size: 12px; color: #f43f5e; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .quiz-question { font-size: 22px; color: #1f2937; font-weight: 700; margin-bottom: 6px; }
        .quiz-instruction { font-size: 13px; color: #9ca3af; margin-bottom: 20px; }
        
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }
        .option-btn {
            background: #ffffff;
            border: 2px solid #fecdd3;
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 15px;
            color: #4b5563;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
        }
        .option-btn:hover { border-color: #f43f5e; background: #fff1f2; }
        .option-btn.selected {
            border-color: #10b981;
            background: #ecfdf5;
            color: #065f46;
        }
        .option-badge {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #fee2e2;
            color: #f43f5e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 13px;
        }
        .option-btn.selected .option-badge {
            background: #10b981;
            color: white;
        }
        
        .success-box {
            background: #ecfdf5;
            border: 2px solid #10b981;
            padding: 20px;
            border-radius: 16px;
            margin-top: 20px;
            text-align: left;
            animation: fadeIn 0.4s ease-in-out;
        }
        .success-box h3 { color: #065f46; font-size: 16px; margin-bottom: 8px; }
        .success-box p { color: #047857; font-size: 14px; margin-bottom: 0; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- 1. LOCKSCREEN ALA IPHONE -->
    <div id="lock-screen" class="lockscreen-container">
        <div class="lock-icon-top">🔒</div>
        <div id="current-date" class="date-text">Monday, November 2</div>
        <div id="current-time" class="time-text">11:53</div>
        
        <div class="passcode-label">Enter Passcode</div>
        
        <div class="dots-container" id="dots-container">
            <div class="dot" id="dot-0"></div>
            <div class="dot" id="dot-1"></div>
            <div class="dot" id="dot-2"></div>
            <div class="dot" id="dot-3"></div>
        </div>
        <div class="hint-text">Hint: Birthday boy date (DDMM, e.g., 0711)</div>

        <!-- Keypad -->
        <div class="keypad" id="keypad">
            <button class="key-btn" onclick="pressKey('1')">1<span class="key-sub"></span></button>
            <button class="key-btn" onclick="pressKey('2')">2<span class="key-sub">abc</span></button>
            <button class="key-btn" onclick="pressKey('3')">3<span class="key-sub">def</span></button>
            <button class="key-btn" onclick="pressKey('4')">4<span class="key-sub">ghi</span></button>
            <button class="key-btn" onclick="pressKey('5')">5<span class="key-sub">jkl</span></button>
            <button class="key-btn" onclick="pressKey('6')">6<span class="key-sub">mno</span></button>
            <button class="key-btn" onclick="pressKey('7')">7<span class="key-sub">pqrs</span></button>
            <button class="key-btn" onclick="pressKey('8')">8<span class="key-sub">tuv</span></button>
            <button class="key-btn" onclick="pressKey('9')">9<span class="key-sub">wxyz</span></button>
            <button class="key-btn key-zero" onclick="pressKey('0')">0</button>
        </div>
    </div>

    <!-- 2. CHAPTER 1 QUIZ CONTENT -->
    <div id="main-content" class="card hidden quiz-container">
        <div class="chapter-title">Chapter 1 · Childhood</div>
        <div class="quiz-question">How did Elgen spend his childhood?</div>
        <div class="quiz-instruction">Pick all the right answers (Select 3 correct choices)</div>

        <div class="options-grid">
            <button class="option-btn" onclick="toggleOption(this, 1)">
                <span>Playing football</span>
                <div class="option-badge">1</div>
            </button>
            <button class="option-btn" onclick="toggleOption(this, 2)">
                <span>Studying 24/7</span>
                <div class="option-badge">X</div>
            </button>
            <button class="option-btn" onclick="toggleOption(this, 3)">
                <span>Reading Naruto comics</span>
                <div class="option-badge">2</div>
            </button>
            <button class="option-btn" onclick="toggleOption(this, 4)">
                <span>Doing silly things</span>
                <div class="option-badge">3</div>
            </button>
        </div>

        <!-- SUCCESS MESSAGE BOX -->
        <div id="success-box" class="success-box hidden">
            <h3>✨ Correct!</h3>
            <p>是不是都在看漫畫，有空去踢足球，剩下時間當屁孩哈哈哈，完全沒看書</p>
        </div>
    </div>

    <script>
        // Update Jam & Tanggal secara Live otomatis
        function updateClock() {
            const now = new Date();
            const optionsDate = { weekday: 'long', month: 'long', day: 'numeric' };
            document.getElementById('current-date').innerText = now.toLocaleDateString('en-US', optionsDate);
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('current-time').innerText = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Logika Passcode Keypad
        let enteredPin = "";
        const correctPin = "0711";
        let selectedCount = 0;

        function pressKey(num) {
            if (enteredPin.length < 4) {
                enteredPin += num;
                updateDots();
                
                if (enteredPin.length === 4) {
                    setTimeout(checkPin, 200);
                }
            }
        }

        function updateDots() {
            for (let i = 0; i < 4; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (i < enteredPin.length) {
                    dot.classList.add('filled');
                } else {
                    dot.classList.remove('filled');
                }
            }
        }

        function checkPin() {
            if (enteredPin === correctPin) {
                document.getElementById('lock-screen').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
            } else {
                const keypad = document.getElementById('keypad');
                keypad.classList.add('error-shake');
                setTimeout(() => {
                    keypad.classList.remove('error-shake');
                    enteredPin = "";
                    updateDots();
                }, 400);
            }
        }

        // Logika Pilihan Ganda Chapter 1
        function toggleOption(btn, id) {
            if (id === 2) {
                alert("Boro2 wkwkwk. Masa kecil koko mana ada belajar 24/7 😂 Coba pilih yang lain!");
                return;
            }

            if (btn.classList.contains('selected')) {
                btn.classList.remove('selected');
                selectedCount--;
            } else {
                btn.classList.add('selected');
                selectedCount++;
            }

            if (selectedCount === 3) {
                document.getElementById('success-box').classList.remove('hidden');
            } else {
                document.getElementById('success-box').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
